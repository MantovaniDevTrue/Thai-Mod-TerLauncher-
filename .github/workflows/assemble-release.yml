name: Assemble TLPro release

on:
  push:
    paths:
      - '.build/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate release
        shell: bash
        run: |
          set -euo pipefail
          cat .build/release/part_*.b64 | tr -d '\n' | base64 --decode > Release/Terraria_Thai_TLPro_v1.0.tl
          python - <<'PY'
          import zipfile
          path = 'Release/Terraria_Thai_TLPro_v1.0.tl'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad is not None:
                  raise SystemExit(f'Invalid archive member: {bad}')
              if 'Settings.json' not in z.namelist():
                  raise SystemExit('Settings.json missing')
          print('Release archive validated successfully.')
          PY

      - name: Commit assembled release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble Terraria Thai TLPro v1.0 release'
          git push
